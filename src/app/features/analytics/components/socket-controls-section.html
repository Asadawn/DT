<div class="mb-3 flex items-center justify-end">
  <dt-chart-range-toggle [(rangeId)]="rangeId" />
</div>

<div class="grid grid-cols-1 items-start gap-3 sm:grid-cols-2 xl:grid-cols-3">
  <dt-chart-card [title]="sockets().length + ' Sockets'">
    @if (sockets().length > 0) {
      <ul class="flex flex-col gap-2 py-1">
        @for (device of sockets(); track device.id) {
          <li class="flex items-center justify-between gap-2 text-sm">
            <span class="truncate">{{ device.name }}</span>
            <dt-status-chip [status]="isOn(device) ? 'active' : 'inactive'" [label]="isOn(device) ? 'Active' : 'Inactive'" />
          </li>
        }
      </ul>
    } @else {
      <div class="text-muted-foreground flex h-full items-center justify-center py-4 text-sm">No sockets in scope.</div>
    }
  </dt-chart-card>

  <dt-chart-card title="Socket Energy" [noData]="energyLabels().length === 0">
    <dt-bar-chart [labels]="energyLabels()" [values]="energyValues()" label="Energy" unit="kWh" />
  </dt-chart-card>

  <dt-chart-card title="Socket Voltage" [loading]="isLoading()" [noData]="!isLoading() && voltage().series.length === 0">
    <dt-multi-series-chart [labels]="voltage().labels" [series]="voltage().series" unit="V" />
  </dt-chart-card>
</div>
