<div class="flex min-h-screen">
  <dt-auth-branding-panel
    heading="Check your inbox."
    description="If an account matches that address, a reset link is on its way."
  />

  <div class="bg-canvas flex flex-1 items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-sm">
      <dt-auth-mobile-logo />

      <div class="rounded-card border-border border bg-white p-6 text-center shadow-sm">
        <span class="bg-merik/10 text-merik mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full text-2xl">✉</span>
        <h2 class="mb-1 text-lg font-medium">Check your email</h2>
        <p class="text-muted-foreground text-sm">
          @if (email) {
            We sent a reset link to <span class="text-foreground font-medium">{{ email }}</span> if an account exists for it.
          } @else {
            We sent a reset link if an account exists for that address.
          }
        </p>

        <a hlmBtn variant="outline" routerLink="/auth/sign-in" class="mt-5 w-full">
          Back to sign in
        </a>
      </div>
    </div>
  </div>
</div>
