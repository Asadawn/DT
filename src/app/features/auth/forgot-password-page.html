<div class="flex min-h-screen">
  <dt-auth-branding-panel
    heading="Forgot your password?"
    description="Enter the email on your account and we'll send you a link to get back in."
  />

  <div class="bg-canvas flex flex-1 items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-sm">
      <dt-auth-mobile-logo />

      <div class="rounded-card border-border border bg-white p-6 shadow-sm">
        <h2 class="mb-1 text-lg font-medium">Reset your password</h2>
        <p class="text-muted-foreground mb-5 text-sm">We'll email you a link to reset it.</p>

        <form class="flex flex-col gap-3.5" (submit)="$event.preventDefault(); onSubmit()">
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Email</span>
            <input
              hlmInput
              type="email"
              [formField]="forgotPasswordForm.email"
              autocomplete="email"
              placeholder="you@example.com"
            />
            @if (forgotPasswordForm.email().touched() && !forgotPasswordForm.email().valid()) {
              <span class="text-xs text-red-600">{{ forgotPasswordForm.email().errors()[0]?.message }}</span>
            }
          </label>

          <button hlmBtn type="submit" [disabled]="submitting()" class="mt-1 w-full">
            @if (submitting()) {
              <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
            }
            {{ submitting() ? 'Sending…' : 'Send reset link' }}
          </button>

          <a routerLink="/auth/sign-in" class="text-muted-foreground text-center text-xs hover:underline">
            Back to sign in
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
