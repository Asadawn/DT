<div class="flex min-h-screen">
  <dt-auth-branding-panel />

  <div class="bg-canvas flex flex-1 items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-sm">
      <dt-auth-mobile-logo />

      <div class="rounded-card border-border border bg-white p-6 shadow-sm">
        <h2 class="mb-1 text-lg font-medium">Sign in</h2>
        <p class="text-muted-foreground mb-5 text-sm">
          Welcome back — enter your details to continue.
        </p>

        <form class="flex flex-col gap-3.5" (submit)="$event.preventDefault(); onSubmit()">
          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Email</span>
            <input
              hlmInput
              type="email"
              [formField]="signInForm.email"
              autocomplete="email"
              placeholder="you@example.com"
            />
            @if (signInForm.email().touched() && !signInForm.email().valid()) {
              <span class="text-xs text-red-600">{{
                signInForm.email().errors()[0]?.message
              }}</span>
            }
          </label>

          <label class="flex flex-col gap-1">
            <span class="text-sm font-medium">Password</span>
            <div class="relative">
              <input
                hlmInput
                [type]="showPassword() ? 'text' : 'password'"
                [formField]="signInForm.password"
                autocomplete="current-password"
                class="w-full pr-9"
                placeholder="••••••••"
              />
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                class="text-muted-foreground hover:text-foreground absolute top-1/2 right-2.5 -translate-y-1/2"
              >
                <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="16" />
              </button>
            </div>
            @if (signInForm.password().touched() && !signInForm.password().valid()) {
              <span class="text-xs text-red-600">{{
                signInForm.password().errors()[0]?.message
              }}</span>
            }
          </label>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-sm">
              <hlm-checkbox
                [checked]="model().rememberMe"
                (checkedChange)="model.update((m) => ({ ...m, rememberMe: $event }))"
              />
              Remember me
            </label>
            <a
              routerLink="/auth/forgot-password"
              class="text-muted-foreground text-xs hover:underline"
            >
              Forgot password?
            </a>
          </div>

          @if (submitError()) {
            <p class="text-xs text-red-600">{{ submitError() }}</p>
          }

          <button hlmBtn type="submit" [disabled]="submitting()" class="mt-1 w-full">
            @if (submitting()) {
              <span
                class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-current border-t-transparent"
              ></span>
            }
            {{ submitting() ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
