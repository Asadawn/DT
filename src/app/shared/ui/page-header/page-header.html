<header class="mb-4 flex flex-col gap-3 @container md:flex-row md:items-start md:justify-between">
  <div class="min-w-0">
    @if (breadcrumb().length) {
      <nav class="text-muted-foreground mb-1.5 flex flex-wrap items-center gap-1 text-xs">
        <ng-icon name="lucideHouse" size="12" class="shrink-0" />
        @for (crumb of breadcrumb(); track crumb; let last = $last) {
          <ng-icon name="lucideChevronRight" size="12" class="text-muted-foreground/60 shrink-0" />
          @if (isLink(crumb)) {
            <a [routerLink]="crumb.link" class="hover:text-foreground hover:underline">{{ crumb.label }}</a>
          } @else {
            <span [class.text-foreground]="last">{{ crumb }}</span>
          }
        }
      </nav>
    }
    <div class="flex items-center gap-3">
      @if (icon(); as name) {
        <span class="bg-dashboard-accent/10 text-dashboard-accent flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl">
          <ng-icon [name]="name" size="22" />
        </span>
      }
      <div class="flex min-w-0 flex-col">
        <div class="flex items-center gap-3">
          <h1 class="truncate text-2xl font-semibold">{{ title() }}</h1>
          <ng-content select="[status]" />
        </div>
        @if (description()) {
          <p class="text-muted-foreground mt-1 flex items-center gap-1 text-sm">
            @if (descriptionIcon(); as name) {
              <ng-icon [name]="name" size="12" class="shrink-0" />
            }
            {{ description() }}
          </p>
        }
      </div>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <ng-content select="[actions]" />
  </div>
</header>
